name: quality

# Runs the same gates as .pre-commit-config.yaml, so a commit that passes
# locally passes here. Every step below fails the build on findings — none
# of them are advisory.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans history, so a shallow clone would miss secrets
          # introduced in earlier commits.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy vulture "bandit[toml]" pip-audit pytest
          # Qt needs its runtime libs present for mypy to resolve PySide6.
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check --output-format=github .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy strict)
        run: mypy svg_converter.py
        # PySide6's bundled stubs make QWidget resolve to Any, which trips
        # strict mode's subclass check. Tracked in PLAN.md; not a code defect.
        continue-on-error: true

      - name: Tests
        run: pytest tests/ -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Dead code (vulture)
        run: vulture svg_converter.py --min-confidence 60

      - name: Security (bandit)
        run: bandit -c pyproject.toml -r . -ll

      - name: Dependency audit
        run: pip-audit --requirement requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
